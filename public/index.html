  <style>
    :root { --a1:#e07a2f; --a2:#f2c14e; --a3:#8c3b1f; --acc:#e07a2f; --acc-fg:#ffffff;
      --safe-b: var(--un-safe-inset-bottom, env(safe-area-inset-bottom, 0px));
      --r:14px; --r-sm:10px; }
    html.dark { --bg:#15110e; --s1:#1e1814; --s2:#29211b; --s3:#382d25; --fg:#f4ece4; --mut:#b4a596; --line:#3a2f27; --shade:rgba(0,0,0,.35); }
    html:not(.dark) { --bg:#f7f1ea; --s1:#fffaf5; --s2:#efe5d9; --s3:#e3d4c2; --fg:#2a1f17; --mut:#6c5c4e; --line:#e0d1bf; --shade:rgba(60,40,20,.12); }
    * { box-sizing:border-box; }
    html, body { background:var(--bg); color:var(--fg); }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size:15px; line-height:1.45; min-height:100vh; -webkit-text-size-adjust:100%; }
    button, input, select, textarea { font:inherit; color:inherit; }
    a { color:var(--acc); }
    .accent-bar { height:3px; background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3)); }
    header.top { position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
    .top-in { max-width:980px; margin:0 auto; display:flex; align-items:center; gap:8px; padding:8px 12px; }
    .brand { display:flex; align-items:center; gap:8px; font-weight:700; font-size:17px; min-width:0; flex:1; background:none; border:0; padding:4px 0; text-align:left; cursor:pointer; }
    .brand .logo { width:30px; height:30px; border-radius:9px; flex:none; background:linear-gradient(135deg,var(--a1),var(--a3)); display:grid; place-items:center; }
    .brand .nm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    h2 { font-size:17px; font-weight:700; margin:18px 0 8px; }

    p { margin:0 0 8px; }
    .mut { color:var(--mut); }
    .small { font-size:13px; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .row.nw { flex-wrap:nowrap; }
    .grow { flex:1; min-width:0; }
    .col { display:flex; flex-direction:column; gap:8px; }
    .grid2 { display:grid; grid-template-columns:1fr; gap:10px; }
    @media (min-width:640px) { .grid2 { grid-template-columns:1fr 1fr; } }
    .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
    @media (min-width:640px) { .cards { grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); } }
    .panel { background:var(--s1); border:1px solid var(--line); border-radius:var(--r); padding:12px; }
    .panel + .panel { margin-top:10px; }
    .sep { height:1px; background:var(--line); margin:12px 0; border:0; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px; padding:0 14px; border-radius:12px; border:1px solid var(--line); background:var(--s2); font-weight:600; cursor:pointer; white-space:nowrap; touch-action:manipulation; }
    .btn:hover { background:var(--s3); }
    .btn.pri { background:var(--acc); color:var(--acc-fg); border-color:transparent; }
    .btn.pri:hover { filter:brightness(1.08); }
    .btn.ghost { background:transparent; border-color:transparent; }
    .btn.sm { min-height:36px; padding:0 10px; font-size:14px; border-radius:10px; }
    .btn.icon { width:44px; padding:0; }
    .btn.sm.icon { width:36px; }
    .btn.danger { color:#e5484d; }
    .btn[disabled] { opacity:.45; pointer-events:none; }
    .btn.on { background:var(--acc); color:var(--acc-fg); border-color:transparent; }
    .btn.block { width:100%; }
    :focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
    .chip { display:inline-flex; align-items:center; gap:4px; min-height:36px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:var(--s1); font-size:14px; cursor:pointer; white-space:nowrap; }
    .chip.on { background:var(--acc); color:var(--acc-fg); border-color:transparent; }
    .chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
    .chips::-webkit-scrollbar { display:none; }
    label.f { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--mut); font-weight:600; }
    .inp { width:100%; min-height:44px; padding:8px 12px; border-radius:12px; border:1px solid var(--line); background:var(--s1); color:var(--fg); font-size:15px; }
    textarea.inp { min-height:72px; resize:vertical; }
    select.inp { appearance:auto; }
    input[type=range] { width:100%; accent-color:var(--acc); min-height:28px; }
    input[type=checkbox] { accent-color:var(--acc); }
    .rng { display:grid; grid-template-columns:minmax(70px,auto) 1fr 48px; gap:8px; align-items:center; font-size:13px; }
    .rng output { text-align:right; font-variant-numeric:tabular-nums; color:var(--mut); }
    .tip { display:inline-grid; place-items:center; width:20px; height:20px; border-radius:50%; border:1px solid var(--line); background:var(--s2); color:var(--mut); font-size:12px; font-weight:700; cursor:pointer; vertical-align:middle; margin-left:4px; padding:0; }
    #tipbox { position:fixed; z-index:80; max-width:280px; background:var(--s1); color:var(--fg); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:13px; box-shadow:0 8px 30px var(--shade); display:none; }
    #tipbox b { display:block; margin-bottom:2px; }
    .steps { display:flex; gap:4px; margin:6px 0 12px; }
    .steps button { flex:1; min-width:0; border:0; background:none; padding:0; cursor:pointer; text-align:left; color:var(--mut); }
    .steps .bar { height:6px; border-radius:6px; background:var(--s3); margin-bottom:4px; }
    .steps .done .bar { background:color-mix(in srgb, var(--acc) 55%, var(--s3)); }
    .steps .cur .bar { background:var(--acc); }
    .steps .cur { color:var(--fg); font-weight:700; }
    .steps span { display:block; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .gcard { position:relative; text-align:left; background:var(--s1); border:1px solid var(--line); border-radius:var(--r); padding:10px; cursor:pointer; display:flex; flex-direction:column; gap:4px; min-height:118px; overflow:hidden; }
    .gcard .sw { position:absolute; left:0; right:0; top:0; height:4px; }
    .gcard .ic { font-size:26px; line-height:1; margin-top:4px; }
    .gcard .nm { font-weight:700; font-size:14px; line-height:1.25; }
    .gcard .rg { font-size:12px; color:var(--mut); line-height:1.3; }
    .gcard.selA { outline:2px solid var(--acc); }
    .gcard.selB { outline:2px dashed var(--acc); }
    .gcard .badge { position:absolute; right:8px; top:10px; font-size:11px; font-weight:700; padding:1px 7px; border-radius:999px; background:var(--acc); color:var(--acc-fg); }
    .tag { display:inline-block; font-size:11px; font-weight:600; padding:1px 7px; border-radius:999px; background:var(--s2); color:var(--mut); }
    .note-box { border-left:3px solid var(--a2); background:var(--s2); padding:8px 10px; border-radius:8px; font-size:13px; }
    .empty { text-align:center; padding:28px 12px; color:var(--mut); }
    .empty .big { font-size:40px; }
    .list { display:flex; flex-direction:column; }
    .li { display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); }
    .li:last-child { border-bottom:0; }
    .tabs { display:flex; gap:4px; overflow-x:auto; border-bottom:1px solid var(--line); margin:8px 0 10px; scrollbar-width:none; }
    .tabs::-webkit-scrollbar { display:none; }
    .tabs button { border:0; background:none; padding:10px 12px; min-height:44px; font-weight:600; color:var(--mut); border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap; }
    .tabs button.on { color:var(--fg); border-bottom-color:var(--acc); }
    .seg { display:inline-flex; background:var(--s2); border-radius:12px; padding:3px; gap:2px; }
    .seg button { border:0; background:none; min-height:36px; padding:0 12px; border-radius:9px; font-weight:600; font-size:14px; cursor:pointer; color:var(--mut); }
    .seg button.on { background:var(--s1); color:var(--fg); box-shadow:0 1px 3px var(--shade); }
    .seg.lang { padding:2px; }
    .seg.lang button { min-height:32px; padding:0 10px; white-space:nowrap; }
    .seg.lang button.on { background:var(--acc); color:var(--acc-fg); box-shadow:none; }
    /* Drum sequencer */
    .seq { overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:6px; }
    .seq table { border-collapse:separate; border-spacing:3px; }
    .seq td.lab { position:sticky; left:0; z-index:2; background:var(--s1); font-size:11px; font-weight:600; padding-right:4px; white-space:nowrap; }
    .seq td.lab .nm { display:inline-block; width:64px; overflow:hidden; text-overflow:ellipsis; vertical-align:middle; }
    .seq td.lab .rm { border:0; background:none; color:var(--mut); cursor:pointer; padding:0 2px; font-size:12px; min-width:22px; min-height:36px; }
    .cell { width:30px; height:36px; border-radius:7px; border:0; background:var(--s3); cursor:pointer; padding:0; position:relative; }
    .cell.beat { background:color-mix(in srgb, var(--s3) 70%, var(--fg) 12%); }
    .cell i { position:absolute; inset:0; border-radius:7px; background:var(--acc); opacity:0; }
    .cell.play { box-shadow:inset 0 0 0 2px var(--fg); }
    .barchips { display:flex; gap:4px; overflow-x:auto; padding:4px 0; }
    .barchips button { min-width:36px; min-height:32px; border-radius:8px; border:1px solid var(--line); background:var(--s1); font-size:12px; font-weight:700; cursor:pointer; }
    .barchips button.b { background:var(--s3); }
    .barchips button.play { outline:2px solid var(--acc); }
    /* Piano roll */
    .roll { position:relative; overflow:auto; max-height:min(60vh,520px); border:1px solid var(--line); border-radius:var(--r-sm); background:var(--s1); -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y; }
    .roll-in { display:flex; position:relative; }
    .roll-keys { position:sticky; left:0; z-index:3; flex:none; background:var(--s2); border-right:1px solid var(--line); }
    .roll-keys div { height:var(--rh); font-size:10px; line-height:var(--rh); padding:0 4px; color:var(--mut); border-bottom:1px solid var(--line); white-space:nowrap; width:58px; overflow:hidden; }
    .roll-keys div.blk { background:var(--s3); }
    .roll-keys div.sc { color:var(--fg); font-weight:700; }
    .roll canvas { display:block; touch-action:none; }
    .roll .ph { position:absolute; top:0; bottom:0; width:2px; background:var(--a2); pointer-events:none; z-index:2; display:none; }
    /* Keyboard */
    .kb { position:relative; height:150px; display:flex; user-select:none; -webkit-user-select:none; touch-action:none; overflow-x:auto; }
    .kb .w { flex:none; width:44px; height:150px; background:#fbf7f2; border:1px solid #b7a99a; border-radius:0 0 8px 8px; position:relative; color:#6b5a4b; font-size:11px; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; padding-bottom:6px; }
    .kb .b { position:absolute; width:30px; height:92px; background:#2b221b; border-radius:0 0 6px 6px; z-index:2; color:#cdbfb1; font-size:10px; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; padding-bottom:4px; }
    .kb .down { background:var(--acc) !important; color:var(--acc-fg) !important; }
    .kb .sc::after { content:""; width:6px; height:6px; border-radius:50%; background:var(--a1); margin-top:3px; }
    /* Lyrics */
    .lrow { display:grid; grid-template-columns:28px 1fr auto; gap:6px; align-items:start; padding:6px 0; border-bottom:1px solid var(--line); }
    .lrow .n { color:var(--mut); font-size:12px; padding-top:12px; text-align:right; }
    .lrow .pair { display:grid; grid-template-columns:1fr; gap:4px; }
    @media (min-width:640px) { .lrow .pair { grid-template-columns:1fr 1fr; } }

    .lrow .tr { color:var(--mut); font-style:italic; }
    .lrow.cur .inp:first-child { border-color:var(--acc); }

    .kara .ln2 { font-size:14px; color:var(--mut); margin-top:6px; }
    .kara .w { transition:none; }
    .kara .w.on { color:var(--acc); }
    .kara .w.past { color:var(--fg); }
    .kara .w.fut { color:var(--mut); }
    /* Mixer */

    nav.bnav button.on { color:var(--acc); }

    .overlay { position:fixed; inset:0; z-index:95; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; }
    .overlay.on { display:flex; }
    .overlay .box { background:var(--s1); border-radius:16px; padding:20px 22px; min-width:220px; text-align:center; }
    .spin { width:28px; height:28px; border-radius:50%; border:3px solid var(--s3); border-top-color:var(--acc); animation:spin 1s linear infinite; margin:0 auto 10px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation-duration:3s; } }
    .banner { background:#5a1d1d; color:#ffe9e4; padding:10px 12px; border-radius:12px; font-size:14px; margin-bottom:10px; }
    html:not(.dark) .banner { background:#fde7e3; color:#7a1f15; }
    .idea { display:block; width:100%; text-align:left; cursor:pointer; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--s1); }
    .idea + .idea { margin-top:8px; }
    .kbd { font-family:ui-monospace,monospace; font-size:12px; background:var(--s2); padding:1px 6px; border-radius:6px; }
    .hide { display:none !important; }
    .prose p, .prose li { font-size:14px; }
    .prose ul { padding-left:18px; margin:0 0 8px; list-style:disc; }
    .tune-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px; }
    .tune-grid label { background:var(--s2); border-radius:10px; padding:6px 8px; font-size:12px; font-weight:700; display:flex; flex-direction:column; gap:2px; }
    .tune-grid label.in { outline:1px solid var(--acc); }
    .tune-grid input { width:100%; min-height:36px; border-radius:8px; border:1px solid var(--line); background:var(--s1); padding:0 6px; }
    .chord-chip { min-width:64px; min-height:52px; border-radius:12px; border:1px solid var(--line); background:var(--s1); font-weight:700; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.1; }
    .chord-chip small { font-weight:500; color:var(--mut); font-size:11px; }
    .chord-chip.on { border-color:var(--acc); box-shadow:inset 0 0 0 1px var(--acc); }
    .chord-chip.play { background:var(--acc); color:var(--acc-fg); }
    .chord-chip.play small { color:inherit; }

  <div class="accent-bar"></div>
  <header class="top">
    <div class="top-in">
      <button class="brand" data-a="go" data-v="proyek" aria-label="Proyek">
        <span class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5" fill="#fff"/><circle cx="17.5" cy="16" r="2.5" fill="#fff"/></svg></span>

function rngOf(seed) { let a = (seed >>> 0) || 1; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mod = (n, m) => ((n % m) + m) % m;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = (rng, arr) => arr[Math.floor(rng() * arr.length) % arr.length];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

// Stretch or squeeze a pattern string to n steps, keeping hits as hits.
function resample(str, n) {
  str = str || '';
  if (str.length === n) return str;
  if (!str.length) return '.'.repeat(n);
  let out = '', last = -1;
  for (let i = 0; i < n; i++) {
    const j = Math.floor(i * str.length / n);
    const c = str[j];
    out += (j === last && c !== '.' && c !== '-') ? '-' : c;
    last = j;
  }
  return out;
}
const VEL = { X:1, x:.85, o:.6, g:.32 };
function patToVels(str, n) { return resample(str, n).split('').map(c => VEL[c] || 0); }

// Parse a chord symbol into { root (pitch class 0..11), iv (intervals), name }.
function parseChord(sym, key, pcs) {
  sym = String(sym || 'I').trim();
  const deg = sym.match(/^([1-7])(.*)$/);
  if (deg) {
    const n = +deg[1] - 1, len = pcs.length, idx = n % len;
    const at = k => pcs[(idx + k) % len] + 12 * Math.floor((idx + k) / len);
    const rootPc = pcs[idx];
    let iv = [0, at(2) - rootPc, at(4) - rootPc];
    if (deg[2] === '5') iv = [0, 7];
    const root = mod(key + rootPc, 12);
    return { root, iv, name: NOTE_NAMES[root] + (len <= 5 ? '' : (iv[1] === 3 ? 'm' : '')), deg: sym };
  }

let saveTimer = null;
function loadStore() {
  try {

    const savedLang = localStorage.getItem('md.lang'); S.lang = savedLang === 'en' ? 'en' : 'id';
  } catch (e) { S.projects = []; }
}
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 500); }
function saveNow() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ projects: S.projects, lastId: S.proj && S.proj.id })); }
  catch (e) { toast(t('storageFull')); }
}
function validProject(p) { return p && p.id && Array.isArray(p.tracks) && p.style && p.patterns; }
function openProject(id) {
  const p = S.projects.find(x => x.id === id); if (!p) return;
  if (P.playing) transportStop();
  S.proj = p; S.undo = []; S.redo = []; S.ver++; S.sel = null; S.chordSel = 0; P.loopA = 0; P.loopB = Math.max(0, p.bars - 1);
  applyAccent(); saveSoon();
}
function addProject(p) { S.projects.unshift(p); openProject(p.id); saveNow(); }

// ---- undo/redo: snapshots of the whole project
function snapshot() { return JSON.stringify(S.proj); }
function commit(fn, opts) {
  if (!S.proj) return;
  S.undo.push(snapshot()); if (S.undo.length > 60) S.undo.shift(); S.redo = [];
  fn(S.proj);
  touched(opts);
}
function touched(opts) {
  S.proj.updatedAt = Date.now(); S.ver++; saveSoon();
  if (!opts || opts.render !== false) render();
}
function restore(json) {
  const p = JSON.parse(json);
  const i = S.projects.findIndex(x => x.id === p.id);
  if (i >= 0) S.projects[i] = p; S.proj = p; S.ver++; applyAccent(); saveSoon(); render();
}
function doUndo() { if (!S.undo.length) return toast(t('nothingUndo')); S.redo.push(snapshot()); restore(S.undo.pop()); toast(t('undone')); }
function doRedo() { if (!S.redo.length) return toast(t('nothingRedo')); S.undo.push(snapshot()); restore(S.redo.pop()); toast(t('redone')); }

// ---- accent colours follow the chosen style
function lum(hex) { const h = hex.replace('#', ''); const v = [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255).map(c => c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4)); return .2126 * v[0] + .7152 * v[1] + .0722 * v[2]; }
function applyAccent() {
  const g = S.proj ? GMAP[S.proj.style.a] : null;
  const col = g ? g.col : ['#e07a2f', '#f2c14e', '#8c3b1f'];
  const r = document.documentElement.style;
  r.setProperty('--a1', col[0]); r.setProperty('--a2', col[1]); r.setProperty('--a3', col[2]);
  const acc = col.find(c => { const l = lum(c); return l > .04 && l < .8; }) || '#e07a2f';
  r.setProperty('--acc', acc); r.setProperty('--acc-fg', lum(acc) > .45 ? '#1a1410' : '#ffffff');
}

// ---- lyrics templates (used when the AI is not available)
function templateLyrics(p, n) {
  const bank = LYRIC_BANK[p.mood] || LYRIC_BANK.gembira;
  const r = rngOf((p.seed || 1) * 7 + p.lyrics.lines.length + (S.lyricSalt || 0));
  const theme = p.theme || L(['hari ini', 'today']), title = p.title || L(['lagu kita', 'our song']);
  const fill = (s, i) => s.replace('{t}', theme).replace('{j}', title);
  const verse = bank.v.slice().sort(() => r() - .5);
  const out = [];
  const enLyric = p.lyrics.lang === 'en';
  const add = pair => out.push({ text: fill(enLyric ? pair[1] : pair[0]), translation: fill(enLyric ? pair[0] : pair[1]) });
  let vi = 0;
  while (out.length < n) {
    for (let k = 0; k < 4 && out.length < n; k++) add(verse[vi++ % verse.length]);
    for (let k = 0; k < 4 && out.length < n; k++) add(bank.c[k]);
  }
  return out;
}

function karaHTML(step) {
  const p = S.proj; if (!p) return '';
  const lines = p.lyrics.lines;
  if (!lines.length) return `<p class="mut">${esc(t('karaEmpty'))}</p>`;
  const tm = p.lyrics.timing || [];
  let cur = null;
  if (step >= 0 && tm.length) { for (const x of tm) { if (x.s <= step) cur = x; else break; } }
  const li = cur ? cur.l : 0, line = lines[li] || lines[0];
  const words = (line.text || '').split(/\s+/).filter(Boolean);
  const wHTML = words.map((w, i) => `<span class="w ${cur ? (i < cur.w ? 'past' : i === cur.w ? 'on' : 'fut') : 'fut'}">${esc(w)}</span>`).join(' ');
  const nxt = lines[(li + 1) % lines.length];
  return `<div class="ln">${wHTML}</div><div class="ln2">${esc(line.translation || '')}</div>${lines.length > 1 ? `<div class="small mut" style="margin-top:8px">${esc(nxt.text)}</div>` : ''}${!tm.length ? `<p class="small mut">${esc(t('karaAlign'))}</p>` : ''}`;
}

const ROLL_RANGE = { melody: [48, 96], chords: [36, 84], bass: [24, 60] };
const KEYW = 58;

      <button class="btn sm" data-a="delNote"${S.sel ? '' : ' disabled'}>${esc(t('deleteNote'))}</button></div>
  </div>
  <div class="roll" id="roll" style="--rh:14px;margin-top:10px"><div class="roll-in"><div class="roll-keys" id="rollKeys"></div><canvas id="rollCv"></canvas><div class="ph" id="rollPh"></div></div></div>
  <p class="small mut">${esc(t('rollHint'))}</p>`;
};
function rollGeom() {
  const p = S.proj, tr = p.tracks.find(x => x.id === S.rollTrack) || p.tracks[3];
  const [lo, hi] = ROLL_RANGE[tr.id] || [36, 96];
  return { p, tr, lo, hi, rows: hi - lo + 1, rh: 14, cw: Math.round(clamp(16 * S.zoom, 6, 48)), total: totalSteps(p), spb: stepsPerBar(p) };
}
function drawRoll() {
  const cv = document.getElementById('rollCv'); if (!cv) return;
  const G = rollGeom(), { p, tr, lo, hi, rows, rh, cw, total, spb } = G;
  const W = total * cw, H = rows * rh, dpr = window.devicePixelRatio || 1;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  cv.style.touchAction = S.rollMode === 'scroll' ? 'pan-x pan-y' : 'none';
  const x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const css = getComputedStyle(document.documentElement);
  const c = n => css.getPropertyValue(n).trim();
  const pcs = (SCALES[p.scale] || SCALES.major).pcs;
  x.fillStyle = c('--s1'); x.fillRect(0, 0, W, H);
  for (let m = hi; m >= lo; m--) {
    const y = (hi - m) * rh, pc = mod(m, 12), rel = mod(m - p.key, 12);
    if (pcs.includes(rel)) { x.fillStyle = c('--acc'); x.globalAlpha = rel === 0 ? .14 : .07; x.fillRect(0, y, W, rh); x.globalAlpha = 1; }
    else if ([1, 3, 6, 8, 10].includes(pc)) { x.fillStyle = c('--s2'); x.fillRect(0, y, W, rh); }
    x.fillStyle = c('--line'); x.fillRect(0, y + rh - 1, W, 1);
  }
  const beats = meterOf(p).beats;
  for (let s = 0; s <= total; s++) {
    const w = s % spb === 0 ? 2 : beats.includes(s % spb) ? 1 : 0;
    if (!w && cw < 10) continue;
    x.fillStyle = c(w ? '--mut' : '--line'); x.globalAlpha = w === 2 ? .7 : w ? .35 : .5;
    x.fillRect(s * cw, 0, w === 2 ? 1.5 : 1, H); x.globalAlpha = 1;
  }
  const acc = c('--acc');
  (tr.notes || []).forEach(n => {
    if (n.p < lo || n.p > hi) return;
    const y = (hi - n.p) * rh + 1, xx = n.s * cw + 1, w = Math.max(3, n.d * cw - 2);
    x.fillStyle = acc; x.globalAlpha = .45 + n.v * .55; x.fillRect(xx, y, w, rh - 3); x.globalAlpha = 1;
    if (S.sel === n) { x.strokeStyle = c('--fg'); x.lineWidth = 2; x.strokeRect(xx, y, w, rh - 3); }
  });
  const keys = document.getElementById('rollKeys');
  if (keys && keys.dataset.sig !== [lo, hi, p.key, p.scale].join()) {
    keys.dataset.sig = [lo, hi, p.key, p.scale].join();
    let h = ''; for (let m = hi; m >= lo; m--) { const rel = mod(m - p.key, 12), cent = p.tuning.cents[rel]; h += `<div class="${[1, 3, 6, 8, 10].includes(mod(m, 12)) ? 'blk' : ''}${pcs.includes(rel) ? ' sc' : ''}">${noteName(m)}${cent ? ' ' + (cent > 0 ? '+' : '') + cent : ''}</div>`; }
    keys.innerHTML = h;
  }
}
function rollAfter() {
  const cv = document.getElementById('rollCv'), roll = document.getElementById('roll'); if (!cv) return;
  drawRoll();
  const G0 = rollGeom();
  const notes = G0.tr.notes;
  if (!roll.dataset.scrolled) {
    const ps = notes.length ? notes.reduce((a, n) => a + n.p, 0) / notes.length : (G0.lo + G0.hi) / 2;
    roll.scrollTop = Math.max(0, (G0.hi - ps) * G0.rh - roll.clientHeight / 2);
    roll.dataset.scrolled = '1';
  }
  let drag = null;
  const pos = e => { const r = cv.getBoundingClientRect(); const G = rollGeom(); return { st: (e.clientX - r.left) / G.cw, pitch: G.hi - Math.floor((e.clientY - r.top) / G.rh), G }; };
  cv.addEventListener('pointerdown', e => {

function kbUp(id) {

  const meta = [0, 0xff, 0x51, 3, (tempo >> 16) & 255, (tempo >> 8) & 255, tempo & 255, 0, 0xff, 0x58, 4, num, Math.log2(den), 24, 8, 0, 0xff, 0x03].concat(vlq(str(p.name).length), str(p.name), [0, 0xff, 0x2f, 0]);
  tracks.push(meta);
  const spb = stepsPerBar(p);
  p.tracks.forEach((tr, ti) => {
    const ch = tr.kind === 'drums' ? 9 : [0, 1, 2][Math.min(2, ti - 1)] + (ti > 3 ? 0 : 0);
    const ev = [];
    if (tr.kind === 'drums') {
      for (let bar = 0; bar < p.bars; bar++) { const pat = p.patterns[p.patternSeq[bar] || 'A'] || {}; Object.keys(pat).forEach(v => pat[v].forEach((vel, s) => { if (vel > 0) { const at = (bar * spb + s) * perStep; ev.push([at, 0x90 | 9, DRUMS[v].gm, Math.round(vel * 110) + 10], [at + perStep / 2, 0x80 | 9, DRUMS[v].gm, 0]); } })); }
    } else {

    }
    ev.sort((a, b) => a[0] - b[0] || (a[1] & 0xf0) - (b[1] & 0xf0));
    const name = L(tr.name);
    let data = [0, 0xff, 0x03].concat(vlq(str(name).length), str(name)), last = 0;
    ev.forEach(e => { data = data.concat(vlq(Math.max(0, e[0] - last)), [e[1], e[2], e[3]]); last = e[0]; });

  });

  tracks.forEach(d => { bytes = bytes.concat(str('MTrk'), u32(d.length), d); });

function editChord(fn) {
  const p = S.proj, sym = p.progression[S.chordSel] || 'I';
  const m = sym.match(/^([b#]?)(VII|VI|V|IV|III|II|I|vii|vi|v|iv|iii|ii|i)(.*)$/) || ['', '', 'I', ''];
  const lower = m[2] !== m[2].toUpperCase();
  const q = m[3] === '7' ? (lower ? 'm7' : '7') : m[3] === '°' ? 'dim' : m[3] || (lower ? 'm' : '');
  const c = fn({ di: ['I','II','III','IV','V','VI','VII'].indexOf(m[2].toUpperCase()), acc: m[1], q });
  commit(pp => { pp.progression[S.chordSel] = romanOf(c.di, c.acc, c.q); });
}

// ---- field bindings (input/change)
function field(el, ev) {
  const f = el.dataset.f, p = S.proj, val = el.type === 'checkbox' ? el.checked : el.value;
  const outEl = el.parentElement && el.parentElement.querySelector('output');
  const live = (fn) => { if (!p) return; fn(p); touched({ render: false }); };
  if (f === 'q') { S.q = val; document.getElementById('genreGrid').innerHTML = genreCards(); return; }
  if (!p && !['snap'].includes(f)) return;
  switch (f) {
    case 'title': return live(pp => { pp.title = val; if (!pp.nameEdited) { pp.name = val || t('untitled'); document.getElementById('projName').textContent = pp.name; } });
    case 'theme': return live(pp => pp.theme = val);
    case 'pname': return live(pp => { pp.name = val || t('untitled'); pp.nameEdited = true; document.getElementById('projName').textContent = pp.name; });
    case 'mood': return live(pp => pp.mood = val);
    case 'moodSel': return live(pp => pp.mood = val);
    case 'duration': if (ev === 'change') commit(pp => { pp.duration = +val; regenAll(pp); }); return;
    case 'bpm': if (ev === 'input' && el.type === 'range') { setBpm(val); return; } if (ev === 'change') setBpm(val); return;
    case 'blend': if (ev === 'input') { p.style.blend = +val; const d = document.getElementById('blendDesc'); if (d) d.textContent = blendDesc(p); return; } commit(pp => { pp.style.blend = +val; regenAll(pp); }); return;
    case 'lyricLang': return commit(pp => pp.lyrics.lang = val);
    case 'lline': return live(pp => { pp.lyrics.lines[+el.dataset.i].text = val; });
    case 'ltrans': return live(pp => { pp.lyrics.lines[+el.dataset.i].translation = val; });
    case 'keySel': if (ev === 'change') { const d = mod(+val - p.key, 12), dd = d > 6 ? d - 12 : d; ACT.transpose({ dataset: { v: dd } }); } return;
    case 'meter': if (ev === 'change') { commit(pp => { pp.meter = val; pp.bars = barsFor(pp.duration, pp.bpm, val); const keepMeter = val; generate(pp, ['chords', 'bass', 'melody']); const spb = METERS[val].spb; ['A', 'B'].forEach(k => Object.keys(pp.patterns[k]).forEach(v => { const s = pp.patterns[k][v].map(x => x >= .95 ? 'X' : x >= .7 ? 'x' : x >= .45 ? 'o' : x > 0 ? 'g' : '.').join(''); pp.patterns[k][v] = patToVels(s, spb); })); pp.patternSeq = Array.from({ length: pp.bars }, (_, i) => (i % 4 === 3 ? 'B' : 'A')); pp.meter = keepMeter; if (pp.lyrics.lines.length) alignLyrics(pp); }); toast(t('meterChanged')); } return;
    case 'swing': p.swing = +val; if (outEl) outEl.textContent = Math.round(val * 100) + '%'; touched({ render: false }); return;
    case 'addVoice': if (val) commit(pp => { const spb = stepsPerBar(pp); pp.patterns.A[val] = new Array(spb).fill(0); pp.patterns.B[val] = new Array(spb).fill(0); }); return;
    case 'snap': S.snap = +val; return;
    case 'chQual': return editChord(c => ({ ...c, q: val }));
    case 'chPreset': if (val !== '') { const g = GMAP[p.style.a]; const presets = [g.prog].concat(g.progMin ? [g.progMin] : []).concat(CHORD_PRESETS.map(x => x[0])); commit(pp => { pp.progression = presets[+val].slice(); S.chordSel = 0; }); } return;
    case 'chStyle': if (val) commit(pp => { pp.chordStyle = val; pp.chordPat = null; }); return;
    case 'tunePreset': if (TUNINGS[val]) commit(pp => { pp.tuning = { preset: val, cents: TUNINGS[val].c.slice() }; }); return;
    case 'scaleSel': return commit(pp => { pp.scale = val; });
    case 'cent': if (ev === 'change') commit(pp => { pp.tuning.cents[+el.dataset.i] = clamp(Math.round(+val || 0), -100, 100); pp.tuning.preset = 'custom'; }); return;
    case 'kbTrack': S.kbTrack = val; return;
    case 'guideVoice': S.guideVoice = val; if (val && !window.speechSynthesis) { toast(t('noSpeech')); S.guideVoice = false; el.checked = false; } return;
    case 'loopOn': P.loop = val; if (P.loopB < P.loopA) P.loopB = P.loopA; chrome(); return;
    case 'loopA': P.loopA = +val; if (P.loopB < P.loopA) { P.loopB = P.loopA; const b = document.querySelector('[data-f="loopB"]'); if (b) b.value = P.loopB; } return;
    case 'loopB': P.loopB = Math.max(+val, P.loopA); el.value = P.loopB; return;
    case 'metro': P.metro = val; chrome(); return;
    case 'loopSong': S.loopSong = val; return;
    case 'masterVol': p.mixer.master.vol = +val; if (outEl) outEl.textContent = Math.round(val * 100); applyMixer(A.g, p); touched({ render: false }); return;
    case 'limiter': p.mixer.master.limiter = val; applyMixer(A.g, p); touched({ render: false }); return;
  }
  let m;
  if ((m = f.match(/^mx\.(\w+)\.(\w+)$/))) {
    const tr = p.tracks.find(x => x.id === m[2]); if (!tr) return;
    tr.mixer[m[1]] = el.type === 'checkbox' ? val : +val;
    if (outEl) outEl.textContent = m[1] === 'pan' ? panLabel(+val) : m[1] === 'filter' ? Math.round(cutHz(+val)) : Math.round(+val * 100);
    applyMixer(A.g, p); touched({ render: false }); return;
  }
  if ((m = f.match(/^instSel\.(\w+)$/))) { if (ev === 'change') { commit(pp => { pp.tracks.find(x => x.id === m[1]).inst = instDefaults(val); }); ACT.hearInst({ dataset: { v: m[1] } }); } return; }
  if ((m = f.match(/^inst\.(\w+)\.(\w+)$/))) {
    const tr = p.tracks.find(x => x.id === m[2]); if (!tr) return;
    const k = m[1]; tr.inst[k] = k === 'wave' ? val : +val;
    if (outEl) { const v = +val; outEl.textContent = k === 's' ? Math.round(v * 100) + '%' : k === 'cut' ? Math.round(v) + ' Hz' : k === 'vd' ? Math.round(v) + ' sen' : k === 'vr' ? v.toFixed(1) + ' Hz' : k === 'q' ? v.toFixed(1) : v.toFixed(2) + 's'; }
    touched({ render: false }); return;
  }
}

function bindEvents() {
  // Unlock audio on the first touch, inside the gesture (phones require it).
  const unlock = () => { ensureAudio(); };
  document.addEventListener('pointerdown', unlock, true);
  document.addEventListener('keydown', unlock, true);
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]');
    if (!el) { if (!e.target.closest('#tipbox')) hideTip(); return; }
    if (el.dataset.a !== 'tip') hideTip();
    const fn = ACT[el.dataset.a]; if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('keydown', e => {
    const el = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && el.getAttribute && el.getAttribute('role') === 'button' && el.dataset.a) { e.preventDefault(); el.click(); return; }
    if (e.key === 'Escape') hideTip();
    const typing = /INPUT|TEXTAREA|SELECT/.test(el.tagName);
    if (typing || e.metaKey || e.ctrlKey || e.altKey) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing && S.proj) { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); }
      return;
    }
    if (S.view === 'musik' && S.tab === 'keys' && S.proj) {
      const k = e.key.toLowerCase();
      if (k === 'z') { ACT.kbOct({ dataset: { v: -1 } }); return; }
      if (k === 'x') { ACT.kbOct({ dataset: { v: 1 } }); return; }
      if (KB_MAP[k] != null && !e.repeat) { e.preventDefault(); kbDown(12 * (S.kbOct + 1) + KB_MAP[k], 'k' + k); return; }
    }
    if (e.key === ' ' && S.proj && el === document.body) { e.preventDefault(); ACT.play(); }
  });
  document.addEventListener('keyup', e => { const k = e.key.toLowerCase(); if (held.has('k' + k)) kbUp('k' + k); });
  document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.f) field(e.target, 'input'); });
  document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.f) field(e.target, 'change'); });
  document.getElementById('fileImport').addEventListener('change', e => { const f = e.target.files[0]; if (f) importFile(f); e.target.value = ''; });
  window.addEventListener('hashchange', route);
  window.addEventListener('resize', () => { if (S.view === 'musik' && S.tab === 'roll') drawRoll(); drawViz(!P.playing); });
  window.addEventListener('usernode:theme-changed', () => setTimeout(render, 0));
  window.addEventListener('usernode:visibility-changed', e => { if (e.detail && e.detail.hidden && P.playing) transportPause(); });
  window.addEventListener('pagehide', saveNow);
}

function init() {
  loadStore();
  const missing = [];
  if (!AC) missing.push(t('noAudio'));
  if (missing.length) document.getElementById('unsupported').innerHTML = `<div class="banner">${missing.map(esc).join(' ')}</div>`;
  if (S.lastId && S.projects.find(p => p.id === S.lastId)) { S.proj = S.projects.find(p => p.id === S.lastId); }
  applyAccent();
  bindEvents();
  route();
}
init();
})();
