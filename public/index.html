<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>TerraTone</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945). This
       app paints a dark page (bg-zinc-950 on the body element), so without
       this tag it sits under a light bar. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <main class="max-w-md mx-auto px-4 py-10 flex flex-col gap-6">

    <section class="rounded-2xl border border-zinc-800 bg-zinc-900/60 p-5 flex flex-col gap-4">
      <h2 class="text-sm font-medium text-zinc-500">Add a photo</h2>
      <div id="preview-wrap" class="hidden rounded-xl overflow-hidden bg-zinc-950/60 border border-zinc-800">
        <img id="preview" alt="Photo preview" class="w-full block">
      </div>
      <label class="block cursor-pointer">
        <span class="flex items-center justify-center gap-2 w-full rounded-xl bg-violet-600 hover:bg-violet-500 active:bg-violet-700 transition-colors text-white text-sm font-semibold px-4 py-3">
          <svg class="w-5 h-5 shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M8 3a1 1 0 0 1 .117-.041L11 3h.004l.84.002a2 2 0 0 1 1.92 1.45l.073.29a.5.5 0 0 0 .48.258h2.24a1.5 1.5 0 0 1 1.5 1.5v8.998A1.5 1.5 0 0 1 16.557 17H3.443a1.5 1.5 0 0 1-1.5-1.5V6.5a1.5 1.5 0 0 1 1.5-1.5h2.24a.5.5 0 0 0 .48-.258l.073-.29A2 2 0 0 1 8.156 3.003L9 3h-1a1 1 0 0 1 0-.001ZM9.5 6a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z" clip-rule="evenodd"/></svg>
          Add a photo
        </span>
        <input id="file-input" type="file" accept="image/*" class="hidden">
      </label>
      <p id="composer-error" class="hidden text-sm text-red-400"></p>
    </section>

    <section class="rounded-2xl border border-zinc-800 bg-zinc-900/60 p-5 flex flex-col gap-4">
      <h2 class="text-sm font-medium text-zinc-500">Filters</h2>
      <div id="filters" class="flex flex-wrap gap-2"></div>
      <button id="save-btn" class="w-full rounded-xl bg-violet-600 hover:bg-violet-500 active:bg-violet-700 disabled:opacity-40 disabled:pointer-events-none transition-colors text-white text-sm font-semibold px-4 py-3" disabled>
        Save to my photos
      </button>
      <p id="save-status" class="hidden text-sm text-violet-300"></p>
      <p id="save-error" class="hidden text-sm text-red-400"></p>
    </section>

    <section>
      <h2 class="text-sm font-medium text-zinc-500 mb-2 px-1">My photos</h2>
      <div id="gallery" class="flex flex-col gap-4"></div>
    </section>

  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const headers = token ? { 'x-usernode-token': token } : {};

    // Stable filter keys with the CSS grading each one applies. The keys
    // must match what server.js accepts; display names are the labels the
    // picker and gallery show.
    const FILTERS = [
      { key: 'original', name: 'Original', css: 'none' },
      { key: 'terracotta', name: 'Terracotta', css: 'sepia(0.45) saturate(1.4) contrast(1.08) hue-rotate(-8deg) brightness(1.02)' },
      { key: 'olive', name: 'Olive', css: 'sepia(0.35) saturate(1.15) contrast(1.1) hue-rotate(18deg) brightness(0.97)' },
      { key: 'sand', name: 'Sand', css: 'sepia(0.55) saturate(1.25) contrast(0.95) brightness(1.08)' },
      { key: 'sage', name: 'Sage', css: 'sepia(0.2) saturate(0.75) contrast(1.05) hue-rotate(35deg) brightness(1.03)' },
      { key: 'clay', name: 'Clay', css: 'sepia(0.5) saturate(1.3) contrast(1.15) hue-rotate(-15deg) brightness(0.95)' },
    ];
    const FILTER_BY_KEY = Object.fromEntries(FILTERS.map(f => [f.key, f]));

    // Max upload size mirrors the platform storage limit. A photo at or
    // over either bound (too big, or the longest edge past this) gets
    // downscaled through a canvas before upload, since storage does no
    // server-side resizing. Canvas re-encode failure falls back to the
    // original file.
    const MAX_UPLOAD_BYTES = 5 * 1024 * 1024;
    const DOWNSCALE_LONG_EDGE = 2048;

    let selectedFile = null; // File or Blob, ready for upload
    let selectedFilter = 'original';

    const fileInput = document.getElementById('file-input');
    const previewWrap = document.getElementById('preview-wrap');
    const previewImg = document.getElementById('preview');
    const filtersEl = document.getElementById('filters');
    const saveBtn = document.getElementById('save-btn');
    const saveStatus = document.getElementById('save-status');
    const saveError = document.getElementById('save-error');
    const composerError = document.getElementById('composer-error');
    const galleryEl = document.getElementById('gallery');

    function showMsg(el, text) { el.textContent = text; el.classList.remove('hidden'); }
    function hideMsg(el) { el.classList.add('hidden'); }

    // Filter picker: one chip per preset, whole-literal classes so the
    // precompiled Tailwind build can see every variant.
    FILTERS.forEach(f => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.filterKey = f.key;
      btn.className = 'rounded-full px-4 py-2 text-sm font-medium border transition-colors';
      btn.textContent = f.name;
      btn.addEventListener('click', () => selectFilter(f.key));
      filtersEl.appendChild(btn);
    });

    function renderFilterState() {
      filtersEl.querySelectorAll('button').forEach(btn => {
        const active = btn.dataset.filterKey === selectedFilter;
        btn.className = active
          ? 'rounded-full px-4 py-2 text-sm font-medium border transition-colors bg-violet-600 border-violet-600 text-white'
          : 'rounded-full px-4 py-2 text-sm font-medium border transition-colors bg-zinc-900 border-zinc-700 text-zinc-300 hover:border-zinc-500';
      });
      previewImg.style.filter = (FILTER_BY_KEY[selectedFilter] || { css: 'none' }).css;
    }

    function selectFilter(key) {
      selectedFilter = key;
      renderFilterState();
    }

    function setPreview(file) {
      const url = URL.createObjectURL(file);
      previewImg.src = url;
      previewWrap.classList.remove('hidden');
    }

    function clearComposer() {
      selectedFile = null;
      fileInput.value = '';
      previewImg.removeAttribute('src');
      previewWrap.classList.add('hidden');
      saveBtn.disabled = true;
      hideMsg(composerError);
    }

    // The user sees errors in plain language; the bridge's structured
    // rejection codes map onto that here.
    function uploadErrorMessage(code) {
      switch (code) {
        case 'file_too_large': return 'That photo is too large. Photos must be under 5 MB.';
        case 'invalid_image': return 'That file is not a valid image. Try a photo in JPG, PNG, GIF or WebP format.';
        case 'app_quota_exceeded':
        case 'user_quota_exceeded':
        case 'staging_quota_exceeded': return 'The storage quota is full. Your photo was not saved.';
        case 'storage_unavailable': return 'Uploads are unavailable right now. Try again later.';
        default: return 'The photo could not be saved. Try again.';
      }
    }

    // Read a chosen file; return the possibly downscaled Blob to upload,
    // or throw a plain-language message. Files too big or with a very
    // long edge go through a canvas first.
    async function prepareFile(file) {
      if (!file.type || !file.type.startsWith('image/')) {
        throw new Error('That file is not an image. Please choose a photo.');
      }
      if (file.size <= MAX_UPLOAD_BYTES) {
        // Still may want a downscale for resolution, but only bother when
        // we can cheaply tell the image's dimensions. Decoding here also
        // catches corrupt files before upload.
        try {
          const bmp = await createImageBitmap(file);
          const longEdge = Math.max(bmp.width, bmp.height);
          bmp.close?.();
          if (longEdge <= DOWNSCALE_LONG_EDGE) return file;
        } catch {
          // Not decodable locally; let storage reject it with a clear code.
          return file;
        }
      }
      // Downscale path: draw the image onto a canvas capped at the long
      // edge, re-encode as JPEG. A blob URL avoids holding the whole
      // bitmap in memory while the encode happens.
      const url = URL.createObjectURL(file);
      try {
        const bmp = await createImageBitmap(file);
        const scale = Math.min(1, DOWNSCALE_LONG_EDGE / Math.max(bmp.width, bmp.height));
        const w = Math.max(1, Math.round(bmp.width * scale));
        const h = Math.max(1, Math.round(bmp.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(bmp, 0, 0, w, h);
        bmp.close?.();
        const blob = await new Promise((resolve, reject) => {
          canvas.toBlob(b => b ? resolve(b) : reject(new Error('downscale failed')), 'image/jpeg', 0.9);
        });
        return blob;
      } catch {
        // Canvas re-encoding can fail on very old or unusual browsers;
        // fall back to the original file and let storage judge it.
        return file;
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files && fileInput.files[0];
      hideMsg(composerError);
      if (!file) return;
      try {
        selectedFile = await prepareFile(file);
        setPreview(selectedFile);
        saveBtn.disabled = false;
      } catch (err) {
        selectedFile = null;
        saveBtn.disabled = true;
        showMsg(composerError, err.message);
      }
    });

    // The blob needs a filename for the platform's storage; the upload API
    // reads it off the File object, and a downscaled blob gets one here.
    function uploadFile() {
      const name = selectedFile.name || 'photo.jpg';
      const payload = selectedFile instanceof File ? selectedFile : new File([selectedFile], name, { type: selectedFile.type || 'image/jpeg' });
      return usernode.uploadFile(payload, { visibility: 'public' });
    }

    saveBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      saveBtn.disabled = true;
      hideMsg(saveStatus);
      hideMsg(saveError);
      try {
        if (!window.usernode || typeof usernode.uploadFile !== 'function') {
          throw new Error('Uploads are unavailable here. You can still preview photos and switch filters.');
        }
        let stored;
        try {
          stored = await uploadFile();
        } catch (err) {
          throw new Error(uploadErrorMessage(err && err.code));
        }
        const res = await fetch('/api/photos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...headers },
          body: JSON.stringify({ file_url: stored.url, filter: selectedFilter }),
        });
        if (!res.ok) {
          let msg = 'The photo could not be saved. Try again.';
          try { const data = await res.json(); if (data && data.error) msg = data.error; } catch {}
          throw new Error(msg);
        }
        clearComposer();
        showMsg(saveStatus, 'Photo saved.');
        await loadGallery();
      } catch (err) {
        showMsg(saveError, err.message || 'The photo could not be saved. Try again.');
        saveBtn.disabled = !selectedFile; // re-enable when the photo is still chosen
      }
    });

    // One gallery card per saved photo, filter re-applied from the stored
    // key. A key that no longer matches a preset renders unfiltered.
    function renderGallery(photos) {
      galleryEl.innerHTML = '';
      if (!photos.length) {
        const p = document.createElement('p');
        p.className = 'text-sm text-zinc-600 px-1';
        p.textContent = 'No photos yet';
        galleryEl.appendChild(p);
        return;
      }
      for (const photo of photos) {
        const f = FILTER_BY_KEY[photo.filter];
        const card = document.createElement('div');
        card.className = 'rounded-2xl border border-zinc-800 bg-zinc-900/60 p-3 flex flex-col gap-2';
        const img = document.createElement('img');
        img.src = photo.file_url;
        img.alt = 'Graded with ' + (f ? f.name : 'no filter');
        img.className = 'w-full rounded-xl block bg-zinc-950/60';
        img.style.filter = f ? f.css : 'none';
        const label = document.createElement('p');
        label.className = 'text-xs text-zinc-500 px-1';
        label.textContent = f ? f.name : 'Original';
        card.appendChild(img);
        card.appendChild(label);
        galleryEl.appendChild(card);
      }
    }

    async function loadGallery() {
      try {
        const res = await fetch('/api/photos', { headers });
        if (!res.ok) throw new Error('Could not load your photos. Try refreshing the page.');
        const { photos } = await res.json();
        renderGallery(photos || []);
      } catch (err) {
        galleryEl.innerHTML = '';
        const p = document.createElement('p');
        p.className = 'text-sm text-red-400 px-1';
        p.textContent = err.message;
        galleryEl.appendChild(p);
      }
    }

    selectFilter('original');
    loadGallery();
  </script>
</body>
</html>
